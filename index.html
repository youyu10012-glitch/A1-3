<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 맞춤 여행지 큐레이터</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <section class="hero-section">
      <div class="intro-box">
        <span class="step-badge">02 / YOUR CURATION</span>
        <h1 class="title">이번 여행,<br><em>어떤 결</em>인가요?</h1>
        <p class="subtitle">세 가지 힌트만 남겨주세요.<br>당신의 다음 장면을 그려볼게요.</p>
        <div class="step-indicator">
          <span class="active">01</span>
          <span>03</span>
        </div>
      </div>

      <div class="form-box">
        <form id="recommend-form">
          <div class="input-group">
            <label for="style">여행 스타일 <span class="required">*</span></label>
            <input type="text" id="style" name="style" placeholder="예: 느린 산책, 로컬 카페, 바다 풍경" required autocomplete="off">
            <span class="helper-text">어떤 분위기를 좋아하시나요?</span>
          </div>

          <div class="input-group">
            <label for="schedule">일정 <span class="required">*</span></label>
            <input type="text" id="schedule" name="schedule" placeholder="예: 2박 3일, 이번 주말" required autocomplete="off">
            <span class="helper-text">얼마나 머무를 예정인가요?</span>
          </div>

          <div class="input-group">
            <label for="companion">동행자 <span class="required">*</span></label>
            <input type="text" id="companion" name="companion" placeholder="예: 혼자, 연인, 친구 2명" required autocomplete="off">
            <span class="helper-text">누구와 함께 떠나나요?</span>
          </div>

          <button type="submit" id="submit-btn" class="submit-button">
            <span>여행지 추천 받기</span>
            <span class="arrow">↗</span>
          </button>
          <div id="status-message" class="status-msg"></div>
        </form>

        <div id="result-box" class="result-box" style="display:none;">
          <h3>✨ AI 추천 결과</h3>
          <p id="result-text"></p>
        </div>
      </div>
    </section>
  </div>
  <script src="js/app.js"></script>
</body>
</html>
